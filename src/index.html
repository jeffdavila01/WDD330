<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SleepOutside • Explore</title>
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/app.js"></script>
</head>

<body>
    <header class="header">
        <div class="shell nav"><a class="brand" href="/index.html">⛺ Sleep<span>Outside</span></a>
            <nav><a href="/index.html#shop">Shop gear</a><a href="/cart/index.html">Cart <span class="count"
                        id="cart-count">0</span></a></nav>
        </div>
    </header>
    <section class="hero">
        <div class="shell">
            <p class="eyebrow">THE ADVENTURE STARTS HERE</p>
            <h1>Step outside.<br><em>Stay curious.</em></h1>
            <p>Find your next tent, backpack, or sleeping bag.</p><a class="btn" href="#shop">Explore gear ↗</a>
        </div>
    </section>
    <main class="shell section" id="shop">
        <div class="section-head">
            <div>
                <p class="eyebrow dark">CURATED FOR EXPLORERS</p>
                <h2>Find your gear</h2>
            </div>
            <p id="status" class="muted" role="status">Loading products…</p>
        </div>
        <div class="filters"><label>Category <select id="category">
                    <option value="all">All gear</option>
                    <option value="tents">Tents</option>
                    <option value="backpacks">Backpacks</option>
                    <option value="sleeping-bags">Sleeping bags</option>
                </select></label><label>Search <input id="search" type="search"
                    placeholder="Search products…"></label><label>Sort <select id="sort">
                    <option value="featured">Featured</option>
                    <option value="asc">Price: Low to high</option>
                    <option value="desc">Price: High to low</option>
                </select></label></div>
        <div id="products" class="product-grid"></div>
    </main>
    <footer class="footer shell">SleepOutside • Personal WDD330 learning project • Demo checkout, no payment processed.
    </footer>
</body>

</html>
