<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SleepOutside • Checkout</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/app.js"></script></head><body><header class="header"><div class="shell nav"><a class="brand" href="/index.html">⛺ Sleep<span>Outside</span></a><nav><a href="/index.html#shop">Shop gear</a><a href="/cart/index.html">Cart <span class="count" id="cart-count">0</span></a></nav></div></header><main class="shell section"><p><a href="/cart/index.html">← Back to cart</a></p><h1 class="page-title">Checkout</h1><p class="muted">Demo only — do not enter real payment details.</p><div class="checkout-layout"><form id="checkout-form" class="checkout-form"><h2>Contact & shipping</h2><div class="two-col"><label>First name<input name="fname" autocomplete="given-name" required minlength="2"></label><label>Last name<input name="lname" autocomplete="family-name" required minlength="2"></label></div><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Street address<input name="street" autocomplete="street-address" required></label><div class="two-col"><label>City<input name="city" required></label><label>Postal code<input name="zip" required pattern="[A-Za-z0-9 -]{3,12}" title="Use a valid postal code"></label></div><h2>Demo payment information</h2><label>Card number (test only)<input name="card" inputmode="numeric" required pattern="[0-9]{16}" maxlength="16" placeholder="4242424242424242" title="Enter a 16-digit test number"></label><div class="two-col"><label>Expiration (MM/YY)<input name="expiration" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" placeholder="12/29"></label><label>Security code<input name="code" inputmode="numeric" required pattern="[0-9]{3,4}" maxlength="4"></label></div><p id="checkout-error" class="error" role="alert" hidden></p><button class="btn" id="place-order" type="submit">Place demo order</button></form><aside class="order-panel"><h2>Your order</h2><div id="order-summary"></div></aside></div></main><footer class="footer shell">SleepOutside • Personal WDD330 learning project • Demo checkout, no payment processed.</footer></body></html>
